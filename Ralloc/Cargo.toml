[package]
name = "ralloc"
version = "0.2.0"
edition = "2024"
description = "Fixed-capacity arena allocator backing the TinyLang v1 runtime"
license-file = "../License.rst"
repository = "https://github.com/ConnerAdamsMaine/TinyOne"

[workspace]
members = ["c-api", "c-static"]
default-members = [".", "c-api", "c-static"]
resolver = "3"

[lib]
name = "ralloc"
path = "src/lib.rs"

[features]
c-staticlib = []
testing-hooks = []

[dependencies]

[dev-dependencies]
static_assertions = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
