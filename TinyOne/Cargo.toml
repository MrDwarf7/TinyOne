[package]
name = "tinylang"
version = "1.0.0"
edition = "2024"

[features]
default = []
testing-hooks = []

[lib]
name = "tinyone"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "tinylang"
path = "src/main.rs"

[[bin]]
name = "tinyone-sandbox-worker"
path = "src/bin/tinyone-sandbox-worker.rs"

[[test]]
name = "language_suite"
path = "tests/language_suite.rs"
harness = false
required-features = ["testing-hooks"]

[dependencies]
thiserror = "2"
blake2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ralloc = { path = "../Ralloc" }
