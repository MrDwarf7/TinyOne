# --- major bump (e.g. 1.0.0 -> 2.0.0) ---
[tasks.bump_major]
description = "Bump major version (1.0.0 -> 2.0.0), update changelog, commit + tag"
run_task = { name = [
  "bump_major_version",
  "gen_changelog_major",
  "commit_version_major",
], parallel = false }

[tasks.bump_major_version]
command = "sh"
args = [
  "-c",
  "if command -v cargo-set-version >/dev/null 2>&1; then cargo set-version --manifest-path crates/tinyone_core/Cargo.toml --bump major; else manifest=crates/tinyone_core/Cargo.toml; version=$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*\"\\([0-9][0-9]*\\)\\.\\([0-9][0-9]*\\)\\.\\([0-9][0-9]*\\)\".*/\\1 \\2 \\3/p' \"$manifest\"); set -- $version; [ \"$#\" -eq 3 ] || { echo \"invalid version in $manifest\" >&2; exit 1; }; sed -i \"s/^[[:space:]]*version[[:space:]]*=.*/version      = \\\"$(($1 + 1)).0.0\\\"/\" \"$manifest\"; fi",
