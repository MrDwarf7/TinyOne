name: "Test"

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  test:
    name: "Test - ${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "${{ matrix.os }}"
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "${{ matrix.target }}"

      - name: "Setup Python + uv"
        uses: "./.github/actions/setup-python"

      - name: "Cargo test (workspace)"
        shell: "bash"
        run: cargo test --workspace -- --test-threads=1

      - name: "Language suite (testing-hooks)"
        shell: "bash"
        run: cargo test --features testing-hooks --test language_suite

      - name: "Python tool tests"
        shell: "bash"
        run: uv run --no-project --python 3.12 python -m unittest discover -s tools -p 'test_*.py'

      - name: "ABI drift"
        shell: "bash"
        run: uv run --no-project --python 3.12 python tools/abi_manifest.py check
