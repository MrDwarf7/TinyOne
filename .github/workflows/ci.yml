name: CI

on:
  push:
  pull_request:

jobs:
  rust-and-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Fix for Git Bash shadowing MSVC link.exe
      - name: Remove Git usr/bin from PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $filtered = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Git\usr\bin*' }) -join ';'
          echo "PATH=$filtered" >> $env:GITHUB_ENV

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Run Python tooling through uv
        shell: bash
        run: uv run --no-project --python 3.12 python -m unittest discover -s Tools -p 'test_*.py'

      - name: Rust checks and tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo fmt --manifest-path TinyOne/Cargo.toml -- --check
          cargo check --manifest-path TinyOne/Cargo.toml
          cargo clippy --manifest-path TinyOne/Cargo.toml --all-targets
          cargo test --manifest-path TinyOne/Cargo.toml
          cargo test --manifest-path TinyOne/Cargo.toml --features testing-hooks --test language_suite

      - name: Rust checks and tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo fmt --manifest-path TinyOne/Cargo.toml -- --check
          cargo check --manifest-path TinyOne/Cargo.toml
          cargo clippy --manifest-path TinyOne/Cargo.toml --all-targets
          cargo test --manifest-path TinyOne/Cargo.toml
          cargo test --manifest-path TinyOne/Cargo.toml --features testing-hooks --test language_suite

      - name: ABI drift
        shell: bash
        run: uv run --no-project --python 3.12 python Tools/abi_manifest.py check

      - name: Consumer compile fixtures (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --manifest-path TinyOne/Cargo.toml
          bash scripts/consumer-compile.sh

      - name: Consumer compile fixtures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path TinyOne/Cargo.toml
          ./scripts/consumer-compile.ps1

  c-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Remove Git usr/bin from PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $filtered = ($env:PATH -split ';' | Where-Object { $_ -notlike '*Git\usr\bin*' }) -join ';'
          echo "PATH=$filtered" >> $env:GITHUB_ENV

      - name: C smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/consumer-smoke.sh

      - name: C smoke (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path TinyOne/Cargo.toml
          $root = (Resolve-Path .).Path
          $build = Join-Path $root 'TinyOne\target\debug'
          $src = Join-Path $root 'tests\consumers\tinylang_consumer.c'
          $import = (Get-ChildItem $build -Filter '*.dll.lib' | Select-Object -First 1).FullName
          if (-not $import) { throw "Rust cdylib import library not found" }
          $out = Join-Path $build 'tinylang_consumer.exe'
          cl.exe /nologo /std:c11 /W4 /WX /I $root $src $import /link "/OUT:$out"
          & (Join-Path $build 'tinylang_consumer.exe')