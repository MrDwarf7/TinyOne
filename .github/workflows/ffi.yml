name: "FFI"

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  ffi-consumer:
    name: "FFI consumer - ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "macos-latest"
            target: "x86_64-apple-darwin"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "${{ matrix.os }}"
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "${{ matrix.target }}"

      - name: "Setup MSVC (Windows)"
        uses: "./.github/actions/setup-msvc"

      - name: "Show GCC/Clang (runner default)"
        uses: "./.github/actions/setup-gcc"
        # Empty inputs deliberately retain the hosted runner's C/C++ compilers.
        # setup-gcc reports their versions for this matrix; do not describe them as pinned.
        with:
          gcc-version: ""
          clang-version: ""

      - name: "Setup Python + uv"
        uses: "./.github/actions/setup-python"

      - name: "Build cdylib"
        shell: "bash"
        run: cargo build

      - name: "ABI drift"
        shell: "bash"
        run: uv run --no-project --python 3.12 python tools/abi_manifest.py check

      - name: "Consumer compile fixtures"
        shell: "bash"
        run: bash scripts/consumer_compile.sh all

      - name: "C smoke (Unix/macOS)"
        if: ${{ runner.os != 'Windows' }}
        shell: "bash"
        run: bash scripts/consumer_smoke.sh

      - name: "C smoke (Windows MSVC)"
        if: ${{ runner.os == 'Windows' }}
        shell: "bash"
        run: bash scripts/consumer_smoke_msvc.sh
