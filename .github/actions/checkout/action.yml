name: "Checkout"
description: "Checkout repository with actions/checkout@v4"

inputs:
  fetch-depth:
    description: "Number of commits to fetch"
    required: false
    default: "1"
  submodules:
    description: "Whether to checkout submodules"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Checkout"
      uses: "actions/checkout@v4"
      with:
        fetch-depth: "${{ inputs.fetch-depth }}"
        submodules: "${{ inputs.submodules }}"
